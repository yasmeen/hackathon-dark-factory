<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tablekeeper · admin</title>
<style>
  :root { --ink:#1c1917; --muted:#78716c; --bg:#fafaf9; --card:#fff; --line:#e7e5e4; --accent:#c2410c; }
  * { box-sizing:border-box; margin:0; }
  body { font-family: ui-sans-serif, system-ui, sans-serif; background:var(--bg); color:var(--ink); }
  header { background:#1c1917; color:#fafaf9; padding:20px; }
  header .wrap { max-width:1100px; margin:0 auto; display:flex; justify-content:space-between; align-items:center; }
  header a { color:#fdba74; font-size:14px; }
  .wrap { max-width:1100px; margin:0 auto; padding:20px; }
  h2 { font-size:16px; margin:22px 0 10px; }
  table { width:100%; border-collapse:collapse; background:#fff; border:1px solid var(--line); border-radius:12px; overflow:hidden; font-size:13px; }
  th, td { text-align:left; padding:10px 12px; border-bottom:1px solid var(--line); }
  th { background:#f5f5f4; color:var(--muted); font-weight:600; font-size:12px; text-transform:uppercase; letter-spacing:.04em; }
  tr:last-child td { border-bottom:0; }
  .pill { display:inline-block; padding:3px 10px; border-radius:999px; font-size:12px; font-weight:600; }
  .confirmed { background:#dcfce7; color:#15803d; } .cancelled { background:#f5f5f4; color:var(--muted); }
  .waiting { background:#fef3c7; color:#b45309; } .offered { background:#dbeafe; color:#1d4ed8; }
  .cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:12px; }
  .stat { background:#fff; border:1px solid var(--line); border-radius:12px; padding:14px; }
  .stat b { font-size:22px; display:block; } .stat span { color:var(--muted); font-size:12px; }
  .refresh { background:var(--accent); color:#fff; border:0; border-radius:10px; padding:10px 18px; cursor:pointer; font-size:14px; }
</style>
</head>
<body>
<header><div class="wrap"><h1>tablekeeper · admin</h1><div><button class="refresh" onclick="load()">Refresh</button> <a href="/">← guest view</a></div></div></header>
<div class="wrap">
  <h2>Today at a glance</h2>
  <div class="cards" id="stats"></div>
  <h2>Upcoming reservations</h2>
  <table><thead><tr><th>When (UTC)</th><th>Restaurant</th><th>Table</th><th>Party</th><th>Guest</th><th>Status</th></tr></thead>
  <tbody id="resv"></tbody></table>
  <h2>Waitlist</h2>
  <table><thead><tr><th>When (UTC)</th><th>Restaurant</th><th>Party</th><th>Guest</th><th>Status</th></tr></thead>
  <tbody id="wait"></tbody></table>
</div>
<script>
async function load() {
  const { reservations, waitlist, occupancy } = await fetch('/api/admin/overview').then(r => r.json());
  const upcoming = reservations.filter(r => r.status === 'confirmed').length;
  const waiting = waitlist.filter(w => w.status === 'waiting').length;
  const offered = waitlist.filter(w => w.status === 'offered').length;
  document.getElementById('stats').innerHTML = `
    <div class="stat"><b>${upcoming}</b><span>confirmed reservations</span></div>
    <div class="stat"><b>${waiting}</b><span>on waitlist</span></div>
    <div class="stat"><b>${offered}</b><span>offered a freed table</span></div>
    <div class="stat"><b>${occupancy.length}</b><span>booked days tracked</span></div>`;
  document.getElementById('resv').innerHTML = reservations.map(r => `
    <tr><td>${r.slot_start_utc.replace('T',' ').slice(0,16)}</td><td>${r.restaurant}</td>
    <td>${r.tbl}</td><td>${r.party_size}</td><td>${r.name}<br><small style="color:var(--muted)">${r.phone}</small></td>
    <td><span class="pill ${r.status}">${r.status}</span></td></tr>`).join('') || '<tr><td colspan="6">None yet.</td></tr>';
  document.getElementById('wait').innerHTML = waitlist.map(w => `
    <tr><td>${w.slot_start_utc.replace('T',' ').slice(0,16)}</td><td>${w.restaurant}</td>
    <td>${w.party_size}</td><td>${w.name}<br><small style="color:var(--muted)">${w.phone}</small></td>
    <td><span class="pill ${w.status}">${w.status}</span></td></tr>`).join('') || '<tr><td colspan="5">Empty.</td></tr>';
}
load();
</script>
</body>
</html>
