<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tablekeeper · admin</title>
<style>
  :root { --ink:#1c1917; --muted:#78716c; --bg:#fafaf9; --card:#fff; --line:#e7e5e4; --accent:#c2410c; }
  * { box-sizing:border-box; margin:0; }
  body { font-family: ui-sans-serif, system-ui, sans-serif; background:var(--bg); color:var(--ink); }
  header { background:#1c1917; color:#fafaf9; padding:20px; }
  header .wrap { padding:0 20px; display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; }
  header h1 { font-size:24px; }
  header h1 span { color:#fdba74; }
  header nav { display:flex; gap:12px; align-items:center; }
  header a { color:#fdba74; font-size:14px; }
  .wrap { max-width:1100px; margin:0 auto; padding:20px; }
  h2 { font-size:16px; margin:22px 0 10px; }
  .scroll { overflow-x:auto; border:1px solid var(--line); border-radius:12px; background:#fff; }
  table { width:100%; border-collapse:collapse; font-size:13px; min-width:560px; }
  th, td { text-align:left; padding:10px 12px; border-bottom:1px solid var(--line); vertical-align:top; overflow-wrap:anywhere; }
  th { background:#f5f5f4; color:var(--muted); font-weight:600; font-size:12px; text-transform:uppercase; letter-spacing:.04em; }
  tr:last-child td { border-bottom:0; }
  small { color:var(--muted); }
  .pill { display:inline-block; padding:3px 10px; border-radius:999px; font-size:12px; font-weight:600; white-space:nowrap; }
  .confirmed { background:#dcfce7; color:#15803d; } .cancelled, .left { background:#f5f5f4; color:var(--muted); }
  .waiting { background:#fef3c7; color:#b45309; } .booked, .promo { background:#dbeafe; color:#1d4ed8; }
  .cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:12px; }
  .stat { background:#fff; border:1px solid var(--line); border-radius:12px; padding:14px; }
  .stat b { font-size:24px; display:block; } .stat span { color:var(--muted); font-size:12px; }
  .refresh { background:var(--accent); color:#fff; border:0; border-radius:10px; padding:10px 18px; cursor:pointer; font-size:14px; }
  .err { background:#fef2f2; color:#b91c1c; border:1px solid #fecaca; border-radius:10px; padding:12px; margin-top:16px; display:none; }
  @media (max-width:520px){ header h1{font-size:20px;} .wrap{padding:16px;} }
</style>
</head>
<body>
<header><div class="wrap"><h1>table<span>keeper</span> · admin</h1>
  <nav><button class="refresh" id="refresh">Refresh</button><a href="/">← guest view</a></nav></div></header>
<div class="wrap">
  <div class="err" id="err"></div>
  <h2>At a glance</h2>
  <div class="cards" id="stats"></div>
  <h2>Upcoming reservations</h2>
  <div class="scroll"><table><thead><tr><th>When (restaurant time)</th><th>Restaurant</th><th>Table</th><th>Party</th><th>Guest</th><th>Status</th></tr></thead>
  <tbody id="resv"></tbody></table></div>
  <h2>Waitlist</h2>
  <div class="scroll"><table><thead><tr><th>When (restaurant time)</th><th>Restaurant</th><th>Party</th><th>Guest</th><th>Status</th></tr></thead>
  <tbody id="wait"></tbody></table></div>
</div>
<script>
const $ = id => document.getElementById(id);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const token = new URLSearchParams(location.search).get('token');

async function load() {
  const res = await fetch('/api/admin/overview', { headers: token ? { 'x-admin-token': token } : {} });
  if (!res.ok) {
    $('err').textContent = res.status === 401 ? 'Admin token required — open /admin?token=…' : 'Could not load the dashboard.';
    $('err').style.display = 'block';
    return;
  }
  $('err').style.display = 'none';
  const { stats, reservations, waitlist } = await res.json();
  $('stats').innerHTML = [
    [stats.upcoming_confirmed, 'upcoming confirmed'],
    [stats.waiting, 'guests on a waitlist'],
    [stats.promoted, 'booked from the waitlist'],
    [stats.cancelled, 'cancellations'],
  ].map(([n, label]) => `<div class="stat"><b>${esc(n)}</b><span>${esc(label)}</span></div>`).join('');
  $('resv').innerHTML = reservations.map(r => `
    <tr><td>${esc(r.when_local)}</td><td>${esc(r.restaurant)}</td><td>${esc(r.tbl)}</td><td>${esc(r.party_size)}</td>
    <td>${esc(r.name)}<br><small>${esc(r.phone)}</small></td>
    <td><span class="pill ${esc(r.status)}">${esc(r.status)}</span>${r.from_waitlist ? ' <span class="pill promo">from waitlist</span>' : ''}</td></tr>`).join('')
    || '<tr><td colspan="6">None yet.</td></tr>';
  $('wait').innerHTML = waitlist.map(w => `
    <tr><td>${esc(w.when_local)}</td><td>${esc(w.restaurant)}</td><td>${esc(w.party_size)}</td>
    <td>${esc(w.name)}<br><small>${esc(w.phone)}</small></td>
    <td><span class="pill ${esc(w.status)}">${esc(w.status)}</span></td></tr>`).join('')
    || '<tr><td colspan="5">Empty.</td></tr>';
}
$('refresh').addEventListener('click', load);
load();
</script>
</body>
</html>
