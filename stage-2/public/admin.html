<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tablekeeper · admin</title>
<link rel="icon" type="image/png" href="/brand/favicon.png">
<link rel="stylesheet" href="/tk.css">
<style>
  .counts { display: flex; flex-wrap: wrap; gap: 10px 36px; padding: 6px 0 22px; border-bottom: 1px solid var(--line); margin-bottom: 26px; }
  .counts div { display: flex; flex-direction: column; }
  .counts b { font: 600 28px/1.1 var(--mono); }
  .counts span { color: var(--pencil); font-size: 13px; }
  .bar { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .scroll { overflow-x: auto; background: var(--thermal); border: 1px solid var(--grill); margin-bottom: 30px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 600px; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; overflow-wrap: anywhere; }
  th { font: 600 11px/1.2 var(--mono); color: var(--pencil); text-transform: uppercase; letter-spacing: .04em; border-bottom-color: var(--grill); }
  tr:last-child td { border-bottom: 0; }
  td.when { font-family: var(--mono); white-space: nowrap; }
  small { color: var(--pencil); font-family: var(--mono); }
  .tag { display: inline-block; font: 600 11px/1 var(--mono); text-transform: uppercase; padding: 4px 6px; border: 1px solid currentColor; border-radius: 3px; white-space: nowrap; }
  .confirmed { color: var(--fired); } .cancelled, .left { color: var(--pencil); }
  .waiting { color: #8a5a00; } .booked, .promo { color: var(--grill); background: var(--glaze); border-color: var(--grill); }
</style>
</head>
<body>
<header class="mast">
  <img src="/brand/mark.png" alt="">
  <a class="word" href="/admin">tablekeeper</a>
  <p class="line"><b>Admin.</b> Who is eating where, and who is waiting.</p>
</header>
<main class="wrap">
  <div class="err" id="err" role="alert"></div>
  <div class="counts" id="stats"></div>
  <div class="bar"><h2>Upcoming reservations</h2><span><button class="btn ghost" id="refresh">Refresh</button> <a class="btn ghost" href="/">Guest view</a></span></div>
  <div class="scroll"><table><thead><tr><th>When (restaurant time)</th><th>Restaurant</th><th>Table</th><th>Party</th><th>Guest</th><th>Status</th></tr></thead>
  <tbody id="resv"></tbody></table></div>
  <h2>Waitlist</h2>
  <div class="scroll"><table><thead><tr><th>When (restaurant time)</th><th>Restaurant</th><th>Party</th><th>Guest</th><th>Status</th></tr></thead>
  <tbody id="wait"></tbody></table></div>
</main>
<script>
const $ = id => document.getElementById(id);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const token = new URLSearchParams(location.search).get('token');

async function load() {
  const res = await fetch('/api/admin/overview', { headers: token ? { 'x-admin-token': token } : {} });
  if (!res.ok) {
    $('err').textContent = res.status === 401 ? 'Admin token required. Open /admin?token=…' : 'Could not load the dashboard.';
    $('err').style.display = 'block';
    return;
  }
  $('err').style.display = 'none';
  const { stats, reservations, waitlist } = await res.json();
  $('stats').innerHTML = [
    [stats.upcoming_confirmed, 'upcoming, confirmed'],
    [stats.waiting, 'waiting for a table'],
    [stats.promoted, 'booked from the waitlist'],
    [stats.cancelled, 'cancelled'],
  ].map(([n, label]) => `<div><b>${esc(n)}</b><span>${esc(label)}</span></div>`).join('');
  $('resv').innerHTML = reservations.map(r => `
    <tr><td class="when">${esc(r.when_local)}</td><td>${esc(r.restaurant)}</td><td>${esc(r.tbl)}</td><td>${esc(r.party_size)}</td>
    <td>${esc(r.name)}<br><small>${esc(r.phone)}</small></td>
    <td><span class="tag ${esc(r.status)}">${esc(r.status)}</span>${r.from_waitlist ? ' <span class="tag promo">from waitlist</span>' : ''}</td></tr>`).join('')
    || '<tr><td colspan="6">Nothing booked yet.</td></tr>';
  $('wait').innerHTML = waitlist.map(w => `
    <tr><td class="when">${esc(w.when_local)}</td><td>${esc(w.restaurant)}</td><td>${esc(w.party_size)}</td>
    <td>${esc(w.name)}<br><small>${esc(w.phone)}</small></td>
    <td><span class="tag ${esc(w.status)}">${esc(w.status)}</span></td></tr>`).join('')
    || '<tr><td colspan="5">Nobody is waiting.</td></tr>';
}
$('refresh').addEventListener('click', load);
load();
</script>
</body>
</html>
